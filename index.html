<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GATE Command Center · Gaurav Tiwari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   GATE COMMAND CENTER
   Analytics-dashboard language: flat white surfaces, hairline
   borders, one restrained data palette, tabular numerals.
   ══════════════════════════════════════════════════════════════ */
:root{
  /* Surfaces */
  --bg:#F7F8FA;
  --card:#FFFFFF;
  --sunken:#F2F4F7;
  --border:#EAECF0;
  --border-2:#DDE1E9;

  /* Ink — body values clear 4.5:1 on white */
  --ink:#16192C;
  --ink-2:#3D4258;
  --muted:#5D647A;
  --faint:#98A0B3;      /* non-text only: axis ticks, dividers */

  /* Data palette — used for meaning, never decoration */
  --blue:#2E6BF6;      --blue-ink:#1D4FD7;  --blue-soft:#EDF2FE;
  --green:#16A34A;     --green-ink:#136B33; --green-soft:#E9F7EF;
  --amber:#F5A524;     --amber-ink:#B45309; --amber-soft:#FEF6E9;
  --indigo:#6366F1;    --indigo-ink:#4F46E5;--indigo-soft:#EEF0FE;
  --red:#E5484D;       --red-ink:#C4292E;   --red-soft:#FDECEC;
  --teal:#0D9488;      --teal-ink:#0F766E;  --teal-soft:#E6F5F3;

  --r-sm:6px; --r:8px; --r-md:10px; --r-lg:12px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px; --s7:40px; --s8:56px;

  --sh-card:0 1px 2px rgba(16,24,40,.04);
  --sh-lift:0 12px 28px -6px rgba(16,24,40,.12), 0 4px 8px -4px rgba(16,24,40,.06);
  --sh-pop:0 16px 40px -8px rgba(16,24,40,.16);

  --e:cubic-bezier(.2,.7,.3,1);
  --t:160ms; --t2:240ms;

  --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font); font-size:14px; line-height:1.5;
  color:var(--ink); background:var(--bg);
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{margin:0; font-weight:600; letter-spacing:-.011em; color:var(--ink)}
p{margin:0}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; border:none; background:none; padding:0}
a{color:var(--blue-ink); text-decoration:none}
ul{margin:0;padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px}
:focus:not(:focus-visible){outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D3D8E0;border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#B9C0CC}

/* ─────────── Top chrome ─────────── */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--card);
  border-bottom:1px solid var(--border);
}
.tb-row{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s6);height:56px}
.tb-row.two{height:44px;gap:var(--s2);border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tb-row.two::-webkit-scrollbar{display:none}

.logo{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--blue);display:grid;place-items:center;color:#fff;flex:0 0 26px}
.logo-mark svg{width:15px;height:15px;stroke-width:2.4}
.logo b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}

.divider{width:1px;height:22px;background:var(--border);flex:0 0 1px}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.who b{font-size:13px;font-weight:600;white-space:nowrap}
.who span{font-size:11.5px;color:var(--muted);white-space:nowrap}

.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}

.pill{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:500;color:var(--ink-2);
  transition:border-color var(--t) var(--e),background var(--t) var(--e);white-space:nowrap;
}
.pill svg{width:14px;height:14px;stroke-width:2;flex:0 0 14px;color:var(--muted)}
button.pill:hover{border-color:var(--border-2);background:var(--sunken)}
.pill b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pill.on{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.pill.on svg{color:var(--green)}
.pill .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 6px}
.pill.on .live-dot{animation:blink 1.6s var(--e) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.avatar{width:30px;height:30px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;
  font-size:11.5px;font-weight:600;flex:0 0 30px;letter-spacing:.02em}

.tab{
  height:32px;padding:0 12px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--muted);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:0 0 auto;
  transition:color var(--t) var(--e),background var(--t) var(--e);
}
.tab svg{width:15px;height:15px;stroke-width:2;flex:0 0 15px}
.tab:hover{color:var(--ink);background:var(--sunken)}
.tab.active{color:var(--blue-ink);background:var(--blue-soft);font-weight:600}
.tab-badge{min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;
  font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tab.active .tab-badge{background:var(--red)}

/* ─────────── Layout ─────────── */
.wrap{max-width:1440px;margin:0 auto;padding:var(--s6)}
.view{display:none}
.view.active{display:block;animation:in var(--t2) var(--e)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
.page-head p{font-size:13px;color:var(--muted);margin-top:3px}
.page-head .right{margin-left:auto;display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}

.sec{display:flex;align-items:center;gap:var(--s3);margin:var(--s7) 0 var(--s4)}
.sec.first{margin-top:0}
.sec h2{font-size:14.5px;font-weight:600}
.sec .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec .right{margin-left:auto;display:flex;gap:var(--s2);align-items:center}

.grid{display:grid;gap:var(--s4)}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-ov{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* ─────────── Card ─────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-card)}
.card-p{padding:var(--s5)}
.card-h{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--border)}
.card-h h3{font-size:13.5px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:var(--s5)}

.dots{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--faint);
  transition:background var(--t) var(--e),color var(--t) var(--e)}
.dots svg{width:15px;height:15px;stroke-width:2.4}
.dots:hover{background:var(--sunken);color:var(--ink-2)}

/* ─────────── Stat card ─────────── */
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4) var(--s5) var(--s5);
  box-shadow:var(--sh-card);transition:box-shadow var(--t2) var(--e),border-color var(--t2) var(--e)}
.stat:hover{border-color:var(--border-2);box-shadow:var(--sh-lift)}
.stat-h{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.stat-h b{font-size:12.5px;font-weight:600;color:var(--ink)}
.stat-h .k{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.stat-v{display:flex;align-items:baseline;gap:9px;margin-bottom:var(--s4);flex-wrap:wrap}
.stat-v .n{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:2px;
  white-space:nowrap}
.delta.up{color:var(--green-ink)} .delta.flat{color:var(--muted)}
.delta svg{width:12px;height:12px;stroke-width:2.6}

.track{height:4px;border-radius:99px;background:var(--sunken);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c,var(--blue));
  transition:width .7s var(--e);min-width:0}
.stat-foot{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}

/* mini bar chart inside a stat card */
.spark{display:flex;align-items:flex-end;gap:4px;height:34px}
.spark i{flex:1;border-radius:3px;background:var(--sunken);min-height:4px;transition:height .5s var(--e)}
.spark i.on{background:var(--c,var(--amber))}

/* ─────────── Donut ─────────── */
.donut{position:relative;width:168px;height:168px;margin:0 auto}
.donut svg{transform:rotate(-90deg);display:block}
.donut .tr{fill:none;stroke:var(--sunken);stroke-width:16}
.donut .fg{fill:none;stroke:var(--blue);stroke-width:16;stroke-linecap:round;
  transition:stroke-dashoffset 1s var(--e)}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut-c .n{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.donut-c .l{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}

.legend{display:flex;flex-direction:column;gap:10px;margin-top:var(--s5)}
.lg{display:flex;align-items:center;gap:9px;font-size:12.5px}
.lg .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.lg .nm{color:var(--muted)}
.lg .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}

/* ─────────── Subject rows ─────────── */
.subj{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--sh-card);transition:border-color var(--t2) var(--e),box-shadow var(--t2) var(--e)}
.subj:hover{border-color:var(--border-2)}
.subj.open{border-color:var(--border-2);box-shadow:var(--sh-lift)}
.subj-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);width:100%;text-align:left;
  transition:background var(--t) var(--e);min-height:44px}
.subj-h:hover{background:#FCFCFD}
.badge{width:34px;height:34px;border-radius:var(--r);flex:0 0 34px;display:grid;place-items:center;color:#fff;
  background:var(--c)}
.badge svg{width:17px;height:17px;stroke-width:2.1}
.subj-m{flex:1;min-width:0}
.subj-m h3{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj-m .meta{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.subj-prog{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.subj-prog .track{width:88px}
.subj-prog .pc{font-size:13px;font-weight:600;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;stroke-width:2.2;color:var(--faint);flex:0 0 16px;
  transition:transform var(--t2) var(--e)}
.subj.open .chev{transform:rotate(90deg)}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:var(--r-sm);background:var(--sunken);
  color:var(--muted);letter-spacing:.02em;flex:0 0 auto}

.chaps{display:none;border-top:1px solid var(--border);background:#FCFCFD}
.subj.open .chaps{display:block}
.subj.open{grid-column:1/-1}

/* ─────────── Chapter ─────────── */
.chap{padding:var(--s4) var(--s5);border-bottom:1px solid var(--border)}
.chap:last-child{border-bottom:none}
.chap-h{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.chap-n{font-size:13px;font-weight:500;color:var(--ink);flex:1;min-width:160px;display:flex;align-items:center;gap:8px}
.qs{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--sunken);padding:2px 7px;border-radius:var(--r-sm);
  flex:0 0 auto;font-variant-numeric:tabular-nums}
.done-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--green-ink);
  background:var(--green-soft);padding:2px 8px;border-radius:var(--r-sm);
  opacity:0;transform:scale(.9);transition:opacity var(--t2) var(--e),transform var(--t2) var(--e)}
.done-tag svg{width:11px;height:11px;stroke-width:3}
.chap.done .done-tag{opacity:1;transform:none}
.chap-t{display:flex;gap:5px;margin-left:auto;align-items:center}
.ib{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--faint);
  border:1px solid transparent;transition:all var(--t) var(--e)}
.ib svg{width:14px;height:14px;stroke-width:2.1}
.ib:hover{background:var(--sunken);color:var(--ink-2);border-color:var(--border)}
.ib.has{color:var(--amber-ink);background:var(--amber-soft)}
.ib.on{color:var(--blue-ink);background:var(--blue-soft)}

/* ─────────── Tri-state control ─────────── */
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2)}
.chap.pyq .tracks{grid-template-columns:minmax(0,240px)}

.tk{
  position:relative;display:flex;align-items:center;gap:9px;height:48px;padding:0 12px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--card);
  text-align:left;width:100%;overflow:hidden;
  transition:border-color var(--t) var(--e),background var(--t) var(--e);
}
.tk:hover{border-color:var(--border-2);background:#FCFCFD}
.tk:active{transform:scale(.985)}
.tk-line{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--tc,var(--blue));
  transition:width .42s var(--e)}
.tk-box{position:relative;width:18px;height:18px;flex:0 0 18px;border-radius:5px;
  border:1.5px solid var(--border-2);background:var(--card);display:grid;place-items:center;
  transition:border-color var(--t2) var(--e),background var(--t2) var(--e)}
.tk-box svg{width:11px;height:11px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tk-box .tick{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset var(--t2) var(--e) 40ms}
.tk-box .half{opacity:0;transition:opacity var(--t) var(--e)}
.tk-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tk-txt b{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-txt i{font-size:11px;font-style:normal;color:var(--muted)}

.tk[data-s="progress"]{--tc:var(--amber);border-color:#F3D9A8;background:var(--amber-soft)}
.tk[data-s="progress"] .tk-line{width:50%}
.tk[data-s="progress"] .tk-box{border-color:var(--amber);background:var(--amber)}
.tk[data-s="progress"] .tk-box .half{opacity:1}
.tk[data-s="progress"] .tk-txt i{color:var(--amber-ink);font-weight:500}

.tk[data-s="done"]{--tc:var(--green);border-color:#B7E4C8;background:var(--green-soft)}
.tk[data-s="done"] .tk-line{width:100%}
.tk[data-s="done"] .tk-box{border-color:var(--green);background:var(--green)}
.tk[data-s="done"] .tk-box .tick{stroke-dashoffset:0}
.tk[data-s="done"] .tk-txt i{color:var(--green-ink);font-weight:500}

.tk.bump .tk-box{animation:bump .3s var(--e)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

/* ─────────── Drawer ─────────── */
.drawer{display:none;margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--border)}
.chap.open .drawer{display:grid;gap:var(--s5);grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  animation:in var(--t2) var(--e)}
.dw h5{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  margin-bottom:var(--s3)}
.subs{display:flex;flex-direction:column;gap:2px;margin-bottom:var(--s3)}
.sub{display:flex;align-items:center;gap:9px;height:34px;padding:0 8px;border-radius:var(--r-sm);font-size:12.5px;
  transition:background var(--t) var(--e)}
.sub:hover{background:var(--sunken)}
.stick{width:16px;height:16px;flex:0 0 16px;border-radius:4px;border:1.5px solid var(--border-2);background:var(--card);
  display:grid;place-items:center;transition:all var(--t2) var(--e)}
.stick svg{width:10px;height:10px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset var(--t2) var(--e)}
.sub.done .stick{background:var(--green);border-color:var(--green);animation:bump .3s var(--e)}
.sub.done .stick svg{stroke-dashoffset:0}
.sub.done .sn{color:var(--faint);text-decoration:line-through}
.sn{flex:1;min-width:0;overflow-wrap:anywhere}
.sdel{width:22px;height:22px;flex:0 0 22px;border-radius:4px;display:grid;place-items:center;color:var(--faint);
  opacity:0;transition:all var(--t) var(--e)}
.sdel svg{width:12px;height:12px;stroke-width:2.2}
.sub:hover .sdel{opacity:1}
.sdel:hover{color:var(--red-ink);background:var(--red-soft)}

/* ─────────── Form ─────────── */
.inp,.ta,.sel{width:100%;height:36px;padding:0 11px;border-radius:var(--r);border:1px solid var(--border-2);
  background:var(--card);font-size:13px;color:var(--ink);transition:border-color var(--t) var(--e),box-shadow var(--t) var(--e)}
.ta{height:auto;padding:9px 11px;resize:vertical;min-height:84px;line-height:1.6}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,107,246,.12);outline:none}
.inp::placeholder,.ta::placeholder{color:var(--faint)}
.row{display:flex;gap:var(--s2)}
.row .inp{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
  border-radius:var(--r);font-size:13px;font-weight:500;white-space:nowrap;
  transition:background var(--t) var(--e),border-color var(--t) var(--e),box-shadow var(--t) var(--e)}
.btn svg{width:14px;height:14px;stroke-width:2.1;flex:0 0 14px}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-ink)}
.btn-s{background:var(--card);color:var(--ink-2);border:1px solid var(--border-2)}
.btn-s:hover{background:var(--sunken);border-color:#CDD3DD}
.btn-d{background:var(--card);color:var(--red-ink);border:1px solid #F5C2C4}
.btn-d:hover{background:var(--red-soft)}
.btn-sm{height:30px;padding:0 10px;font-size:12px}

.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r);padding:3px;gap:2px}
.seg button{height:26px;padding:0 11px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted);
  transition:all var(--t) var(--e)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh-card)}

.search{position:relative;flex:1;max-width:300px;min-width:170px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  stroke-width:2;color:var(--faint);pointer-events:none}
.search .inp{padding-left:34px}

/* ─────────── Bars / charts ─────────── */
.wk{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:var(--s2)}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.wk-bar{width:100%;max-width:34px;border-radius:4px;background:var(--blue-soft);position:relative;
  transition:height .6s var(--e);min-height:3px}
.wk-bar.hot{background:var(--blue)}
.wk-lb{font-size:10.5px;color:var(--muted);white-space:nowrap}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.hc{width:11px;height:11px;border-radius:2px;background:var(--sunken);transition:transform var(--t) var(--e)}
.hc:hover{transform:scale(1.35)}
.hc[data-l="1"]{background:#C7D9FD}
.hc[data-l="2"]{background:#8FB3FB}
.hc[data-l="3"]{background:#5A8DF8}
.hc[data-l="4"]{background:var(--blue)}
.hc.today{box-shadow:0 0 0 1.5px var(--ink)}
.hleg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:var(--s3)}
.hleg .hc{width:10px;height:10px}

.lrow{display:flex;align-items:center;gap:var(--s3);height:32px;font-size:12.5px}
.lrow .nm{flex:0 0 92px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .track{flex:1}
.lrow .v{flex:0 0 auto;min-width:56px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* ─────────── Revision rows ─────────── */
.rev{display:flex;align-items:center;gap:var(--s3);padding:11px var(--s4);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:var(--s2);background:var(--card);
  transition:border-color var(--t) var(--e),background var(--t) var(--e)}
.rev:hover{border-color:var(--border-2);background:#FCFCFD}
.rev.over{border-left:3px solid var(--red)}
.rev.now{border-left:3px solid var(--amber)}
.rev-b{flex:1;min-width:0}
.rev-b b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rev-b span{font-size:11.5px;color:var(--muted)}
.stage{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:var(--indigo-soft);
  color:var(--indigo-ink);flex:0 0 auto;white-space:nowrap}

/* ─────────── Timer ─────────── */
.tm-dial{position:relative;width:190px;height:190px;margin:0 auto var(--s5)}
.tm-dial svg{transform:rotate(-90deg);display:block}
.tm-tr{fill:none;stroke:var(--sunken);stroke-width:10}
.tm-fg{fill:none;stroke:var(--blue);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.tm-t{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:600;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tm-mode{text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:var(--s4)}
.tm-btns{display:flex;gap:var(--s2);justify-content:center;flex-wrap:wrap}

/* ─────────── Links / papers ─────────── */
.lnk{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:1px solid var(--border);
  border-radius:var(--r);font-size:12.5px;color:var(--ink-2);background:var(--card);
  transition:border-color var(--t) var(--e),background var(--t) var(--e)}
.lnk:hover{border-color:var(--border-2);background:var(--sunken)}
.lnk .li{width:26px;height:26px;border-radius:var(--r-sm);flex:0 0 26px;display:grid;place-items:center;
  background:var(--sunken);color:var(--muted)}
.lnk .li svg{width:14px;height:14px;stroke-width:2}
.lnk .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .ex{color:var(--faint);flex:0 0 auto}
.lnk .ex svg{width:13px;height:13px;stroke-width:2}

.cta{display:flex;align-items:center;gap:var(--s4);padding:var(--s5);border:1px solid var(--border);
  border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh-card);flex-wrap:wrap;
  transition:border-color var(--t2) var(--e),box-shadow var(--t2) var(--e)}
.cta:hover{border-color:var(--blue);box-shadow:var(--sh-lift)}
.cta-i{width:42px;height:42px;border-radius:var(--r);background:var(--blue);color:#fff;display:grid;place-items:center;flex:0 0 42px}
.cta-i svg{width:21px;height:21px;stroke-width:2}
.cta-c{flex:1;min-width:200px}
.cta-c h3{font-size:14.5px;font-weight:600}
.cta-c p{font-size:12.5px;color:var(--muted);margin-top:3px}

.paper{display:flex;align-items:center;gap:11px;padding:11px var(--s4);border:1px solid var(--border);
  border-radius:var(--r);background:var(--card);transition:border-color var(--t) var(--e)}
.paper:hover{border-color:var(--border-2)}
.paper.done{background:var(--green-soft);border-color:#C9E9D6}
.paper-b{flex:1;min-width:0}
.paper-b a{display:block;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper-b span{font-size:10.5px;color:var(--faint);word-break:break-all}

.note{border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4);background:var(--card);

.note:hover{border-color:var(--border-2);box-shadow:var(--sh-lift)}
.note-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.note-h b{font-size:13px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-h .sj{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--c-soft);color:var(--c-ink);

.note p{font-size:12.5px;color:var(--ink-2);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}

.set:last-child{border-bottom:none}
.set .l{flex:1;min-width:190px}
.set .l b{display:block;font-size:13px;font-weight:600}
.set .l span{font-size:12px;color:var(--muted)}

.empty{text-align:center;padding:var(--s7) var(--s4);color:var(--muted)}
.empty svg{width:32px;height:32px;stroke-width:1.6;color:var(--border-2);margin-bottom:var(--s3)}
.empty b{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.empty span{font-size:12.5px}

.toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;
  align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:var(--r);background:var(--ink);
  color:#fff;font-size:12.5px;font-weight:500;box-shadow:var(--sh-pop);max-width:min(360px,88vw);
  animation:tin var(--t2) var(--e)}
.toast svg{width:15px;height:15px;stroke-width:2.4;flex:0 0 15px}
.toast.ok svg{color:#4ADE80} .toast.err svg{color:#FCA5A5} .toast.warn svg{color:#FCD34D}
.toast.out{animation:tout var(--t) var(--e) forwards}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}

#cf{position:fixed;inset:0;pointer-events:none;z-index:300}

.mbg{position:fixed;inset:0;background:rgba(16,25,44,.44);z-index:150;display:none;place-items:center;padding:var(--s4)}
.mbg.show{display:grid;animation:in var(--t) var(--e)}
.modal{background:var(--card);border-radius:var(--r-lg);padding:var(--s6);max-width:520px;width:100%;
  box-shadow:var(--sh-pop);max-height:86vh;overflow-y:auto;animation:min var(--t2) var(--e)}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal h3{font-size:16px;margin-bottom:5px}
.modal .md{font-size:12.5px;color:var(--muted);margin-bottom:var(--s5)}

.mob{display:none}

/* ─────────── Responsive ─────────── */
@media (max-width:1100px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-ov{grid-template-columns:1fr}
  .chap.open .drawer{grid-template-columns:1fr}
}
@media (max-width:860px){
  .wrap{padding:var(--s4) var(--s4) 76px}
  .tb-row{padding:0 var(--s4)}
  .tb-row.two{display:none}
  .g-3,.g-2{grid-template-columns:1fr}
  .who{display:none}
  .divider{display:none}
  /* Streak + countdown already appear on the Dashboard; drop them so the
     bar fits a 375px phone instead of scrolling sideways. */
  .pill-info{display:none}
  .mob{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--card);
    border-top:1px solid var(--border);padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));
    justify-content:space-around}
  .mob button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;border-radius:var(--r-sm);
    font-size:10px;font-weight:500;color:var(--muted);min-width:52px;min-height:46px;
    transition:color var(--t) var(--e),background var(--t) var(--e)}
  .mob button svg{width:19px;height:19px;stroke-width:2}
  .mob button.active{color:var(--blue-ink);background:var(--blue-soft)}
  .subj-prog .track{width:56px}
}
@media (max-width:480px){
  .logo b{display:none}
}
@media (max-width:560px){
  .tracks{grid-template-columns:1fr}
  .chap.pyq .tracks{grid-template-columns:1fr}
  .wrap{padding:var(--s3) var(--s3) 76px}
  .card-b,.card-p{padding:var(--s4)}
  .subj-h{padding:var(--s3) var(--s4)}
  .chap{padding:var(--s3) var(--s4)}
  .subj-prog .track{display:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  #cf{display:none}
}
@media print{
  .topbar,.mob,.toasts,#cf{display:none!important}
  body{background:#fff}
  .card,.subj,.stat{box-shadow:none;break-inside:avoid}
}

/* ─────────── Dates (local, no UTC drift) ─────────── */
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return iso(new Date()); }
function parseISO(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function dayDiff(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function prettyDate(s) { return parseISO(s).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }); }
function shortDate(s) { return parseISO(s).toLocaleDateString('en-IN', { day:'numeric', month:'short' }); }

/* ─────────── Progress math ─────────── */
function stOf(chId) {
  if (!S.ch[chId]) S.ch[chId] = { t:'pending', q:'pending', l:'pending', p:'pending' };
  return S.ch[chId];
}
function chDone(chId) {
  var c = CHAP_OF[chId], st = stOf(chId);
  return c.tracks.every(function (t) { return st[t.k] === 'done'; });
}
function chFrac(chId) {
  var c = CHAP_OF[chId], st = stOf(chId), sum = 0;
  c.tracks.forEach(function (t) { sum += st[t.k] === 'done' ? 1 : (st[t.k] === 'progress' ? 0.5 : 0); });
  return sum / c.tracks.length;
}
function subjStats(s) {
  var frac = 0, done = 0, qDone = 0, active = 0;
  s.ch.forEach(function (c) {
    var f = chFrac(c.id); frac += f; qDone += c.q * f;
    if (chDone(c.id)) done++; else if (f > 0) active++;
  });
  return { pct: Math.round(frac / s.ch.length * 100), done: done, total: s.ch.length,
           qDone: Math.round(qDone), active: active };
}
function overall() {
  var frac = 0, done = 0, qDone = 0;
  ALL_CH.forEach(function (c) {
    var f = chFrac(c.id); frac += f; qDone += c.q * f;
    if (chDone(c.id)) done++;
  });
  return { pct: Math.round(frac / TOTAL_CH * 100), done: done, qDone: qDone };
}
function trackStats(k) {
  var tot = 0, d = 0, p = 0;
  ALL_CH.forEach(function (c) {
    if (!c.tracks.some(function (t) { return t.k === k; })) return;
    tot++;
    var v = stOf(c.id)[k];
    if (v === 'done') d++; else if (v === 'progress') p++;
  });
  return { total: tot, done: d, prog: p, pct: tot ? Math.round(d / tot * 100) : 0 };
}
/* Real week-over-week delta from recorded completion dates */
function doneThisWeek() {
  var t = today(), n = 0;
  for (var id in S.doneAt) if (dayDiff(S.doneAt[id], t) <= 6 && dayDiff(S.doneAt[id], t) >= 0) n++;

}

function bump(kind, amount) {

}
function activeDay(d) { var a = S.act[d]; return !!(a && (a.a > 0 || a.m > 0)); }
function streak() {
  var n = 0, d = today();
  if (!activeDay(d)) { d = addDays(d, -1); if (!activeDay(d)) return 0; }
  while (activeDay(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* ─────────── Confetti — restrained palette, short burst ─────────── */
var cvs = el('cf'), ctx = cvs.getContext('2d'), bits = [], rafId = null;
function sizeCanvas() {
  var r = window.devicePixelRatio || 1;
  cvs.width = innerWidth * r; cvs.height = innerHeight * r;
  cvs.style.width = innerWidth + 'px'; cvs.style.height = innerHeight + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
sizeCanvas();
addEventListener('resize', sizeCanvas);
var CF = ['#2E6BF6', '#16A34A', '#F5A524', '#6366F1', '#0D9488'];
function confetti(x, y, count) {
  if (reduceMotion) return;
  for (var i = 0; i < (count || 26); i++) {
    var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5.5;
    bits.push({ x:x, y:y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 3.4,
      s:3 + Math.random() * 4, c:CF[(Math.random() * CF.length) | 0],
      rot:Math.random() * 6.3, vr:(Math.random() - .5) * .3, life:1 });
  }
  if (!rafId) rafId = requestAnimationFrame(step);
}
function step() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (var i = bits.length - 1; i >= 0; i--) {
    var b = bits[i];
    b.vy += 0.26; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life -= 0.016;
    if (b.life <= 0 || b.y > innerHeight + 40) { bits.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = Math.max(0, b.life);
    ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.c;
    ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * .7);
    ctx.restore();
  }
  if (bits.length) rafId = requestAnimationFrame(step);
  else { rafId = null; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

    '<circle class="fg" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r +
    '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - pct / 100)).toFixed(1) + '"' +
    (color ? ' style="stroke:' + color + '"' : '') + '/></svg>';
}
function statCard(label, aside, value, footL, footR, pct, color, spark) {
  return '<div class="stat" style="--c:' + color + '">' +
    '<div class="stat-h"><b>' + esc(label) + '</b><span class="k">' + esc(aside) + '</span></div>' +
    '<div class="stat-v"><span class="n">' + value + '</span>' +
      (spark ? '' : '<span class="delta flat">' + esc(footR) + '</span>') + '</div>' +
    (spark ? spark : '<div class="track"><i style="width:' + pct + '%"></i></div>') +
    '<div class="stat-foot"><span>' + esc(footL) + '</span>' + (spark ? '<span>' + esc(footR) + '</span>' : '') + '</div>' +
  '</div>';
}
function empty(icon, title, sub) {
  return '<div class="empty">' + ic(icon) + '<b>' + esc(title) + '</b><span>' + esc(sub) + '</span></div>';
}

/* ═══════════════ DASHBOARD ═══════════════ */
function vDash() {
  var o = overall(), d = daysLeft(), wk = doneThisWeek();
  var ts = { t:trackStats('t'), q:trackStats('q'), l:trackStats('l'), p:trackStats('p') };

  var h = '<div class="page-head"><div>' +
    '<h1>Dashboard</h1>' +
    '<p>' + esc(S.pf.exam || 'GATE CSE 2027') + ' · ' + TOTAL_CH + ' chapters across ' + SUBJECTS.length + ' subjects</p>' +
    '</div><div class="right">' +
      '<span class="pill">' + ic('cal') + (d === null ? 'Set exam date' : Math.max(0, d) + ' days to exam') + '</span>' +
      '<button class="btn btn-s btn-sm" data-go="subjects" type="button">' + ic('books') + 'Open subjects</button>' +
    '</div></div>';

  /* Track breakdown — 4 stat cards */
  h += '<div class="grid g-4">' +
    statCard('Theory', 'chapters', ts.t.pct + '%', ts.t.done + ' of ' + ts.t.total,
             ts.t.prog + ' in progress', ts.t.pct, 'var(--blue)') +
    statCard('Questions', 'chapters', ts.q.pct + '%', ts.q.done + ' of ' + ts.q.total,
             ts.q.prog + ' in progress', ts.q.pct, 'var(--indigo)') +
    statCard('Lectures', 'chapters', ts.l.pct + '%', ts.l.done + ' of ' + ts.l.total,
             ts.l.prog + ' in progress', ts.l.pct, 'var(--teal)') +
    statCard('PYQ', 'chapters', ts.p.pct + '%', ts.p.done + ' of ' + ts.p.total,
             ts.p.prog + ' in progress', ts.p.pct, 'var(--amber)') +
  '</div>';

  /* Overview donut + weekly activity */
  h += '<div class="grid g-ov" style="margin-top:var(--s4)">';
  h += '<div class="card"><div class="card-h"><div><h3>Syllabus coverage</h3>' +
       '<div class="sub">Weighted across all four trackers</div></div></div>' +
    '<div class="card-b">' +
      '<div class="donut">' + donut(o.pct, 168, 16) +
        '<div class="donut-c"><div><div class="n">' + o.pct + '%</div><div class="l">Complete</div></div></div></div>' +
      '<div class="legend">' +
        legendRow('var(--green)', 'Chapters done', o.done + ' / ' + TOTAL_CH) +
        legendRow('var(--blue)', 'PYQs covered', Math.round(o.qDone).toLocaleString('en-IN') + ' / ' + TOTAL_QS.toLocaleString('en-IN')) +
        legendRow('var(--amber)', 'Completed this week', wk === 0 ? '—' : '+' + wk) +
        legendRow('var(--indigo)', 'Time logged', fmtMin(minsTotal())) +
      '</div></div></div>';

  h += '<div class="card"><div class="card-h"><div><h3>Last 7 days</h3>' +
       '<div class="sub">Minutes logged per day</div></div>' +
       '<div class="right"><span class="pill">' + fmtMin(minsToday()) + ' today</span></div></div>' +
    '<div class="card-b">' + weekBars() + '</div></div>';
  h += '</div>';

  /* Subject progress table */
  h += '<div class="sec"><h2>Subject progress</h2><span class="cnt">' + SUBJECTS.length + ' subjects</span>' +
       '<div class="right"><button class="btn btn-s btn-sm" data-go="subjects" type="button">View all</button></div></div>';
  h += '<div class="card"><div class="card-b" style="padding:var(--s2) var(--s4)">';
  SUBJECTS.map(function (s) { return { s:s, st:subjStats(s) }; })
    .sort(function (a, b) { return b.st.pct - a.st.pct; })
    .forEach(function (r, i) {
      h += '<button class="subj-h" data-open-subj="' + r.s.id + '" type="button" style="' + cvars(r.s) +
        ';border-radius:var(--r);' + (i ? 'border-top:1px solid var(--border);' : '') + 'padding:11px var(--s2)">' +
        '<span class="badge" style="width:28px;height:28px;flex:0 0 28px;border-radius:7px">' + ic(r.s.icon) + '</span>' +
        '<span class="subj-m"><h3 style="font-weight:500">' + esc(r.s.name) + '</h3></span>' +
        '<span class="subj-prog">' +
          '<span class="tag num">' + r.st.done + '/' + r.st.total + '</span>' +
          '<span class="track" style="width:120px;--c:var(--c)"><i style="width:' + r.st.pct + '%"></i></span>' +
          '<span class="pc num">' + r.st.pct + '%</span></span>' +
        ic('chev', 'chev') + '</button>';
    });
  h += '</div></div>';

  /* Revision + heatmap */
  var due = revList().filter(function (r) { return r.over >= 0; });
  h += '<div class="grid g-2" style="margin-top:var(--s6)">';
  h += '<div class="card"><div class="card-h"><div><h3>Revision due</h3>' +
       '<div class="sub">Spaced ladder: 3 → 7 → 21 → 45 days</div></div>' +
       '<div class="right"><span class="tag num">' + due.length + '</span></div></div><div class="card-b">' +
    (due.length ? due.slice(0, 4).map(revRow).join('') +
        (due.length > 4 ? '<button class="btn btn-s btn-sm" data-go="revision" type="button" style="margin-top:var(--s2)">View all ' + due.length + '</button>' : '')
      : empty('cup', 'Nothing due', 'Finish a chapter’s Theory and R1 schedules itself.')) +
    '</div></div>';

  h += '<div class="card"><div class="card-h"><div><h3>Activity</h3>' +
       '<div class="sub">Last 18 weeks</div></div>' +
       '<div class="right"><span class="tag num">' + streak() + ' day streak</span></div></div>' +
       '<div class="card-b">' + heat() + '</div></div>';
  h += '</div>';

  return h + foot();
}

function legendRow(c, nm, v) {
  return '<div class="lg"><span class="sw" style="background:' + c + '"></span>' +
    '<span class="nm">' + esc(nm) + '</span><span class="v num">' + esc(v) + '</span></div>';
}

function weekBars() {
  var days = [], max = 1, t = today();
  for (var i = 6; i >= 0; i--) {
    var d = addDays(t, -i), a = S.act[d];
    var m = a ? Math.round(a.m) : 0;
    max = Math.max(max, m);
    days.push({ d:d, m:m, lb: parseISO(d).toLocaleDateString('en-IN', { weekday:'short' }) });
  }
  return '<div class="wk">' + days.map(function (x, i) {
    var hgt = Math.max(3, Math.round(x.m / max * 96));
    return '<div class="wk-col"><div class="wk-bar' + (i === 6 ? ' hot' : '') + '" style="height:' + hgt + 'px" ' +
      'title="' + shortDate(x.d) + ' — ' + fmtMin(x.m) + '"></div><div class="wk-lb">' + x.lb + '</div></div>';
  }).join('') + '</div>' +
  '<div class="stat-foot" style="margin-top:var(--s3);border-top:1px solid var(--border);padding-top:var(--s3)">' +
    '<span>Peak ' + fmtMin(max) + '</span><span>Total ' + fmtMin(minsTotal()) + '</span></div>';
}

function heat() {
  var DAYS = 126, cells = '', t = today(), max = 1;
  for (var i = 0; i < DAYS; i++) { var a = S.act[addDays(t, -i)]; if (a) max = Math.max(max, a.a + a.m / 12); }
  for (var j = DAYS - 1; j >= 0; j--) {
    var d = addDays(t, -j), a2 = S.act[d], v = a2 ? a2.a + a2.m / 12 : 0;
    var lvl = v === 0 ? 0 : v / max > .66 ? 4 : v / max > .38 ? 3 : v / max > .14 ? 2 : 1;
    cells += '<div class="hc' + (j === 0 ? ' today' : '') + '" data-l="' + lvl + '" title="' + shortDate(d) +
      (a2 ? ' — ' + a2.a + ' updates, ' + fmtMin(a2.m) : ' — no activity') + '"></div>';
  }
  return '<div class="heat">' + cells + '</div>' +
    '<div class="hleg"><span>Less</span><div class="hc" data-l="0"></div><div class="hc" data-l="1"></div>' +
    '<div class="hc" data-l="2"></div><div class="hc" data-l="3"></div><div class="hc" data-l="4"></div><span>More</span>' +
    '<span style="margin-left:auto">' + Object.keys(S.act).length + ' active days</span></div>';
}

function foot() {
  return '<div style="margin-top:var(--s8);padding-top:var(--s4);border-top:1px solid var(--border);' +
    'display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)">' +
    '<span>' + esc(S.pf.name || 'Gaurav Tiwari') + ' · ' + esc(S.pf.exam || 'GATE CSE 2027') + '</span>' +
    '<span style="margin-left:auto" class="num">' + TOTAL_CH + ' chapters · ' + TOTAL_QS.toLocaleString('en-IN') + ' PYQs</span></div>';
}

function revRow(r) {
  var c = CHAP_OF[r.id], s = SUBJ_OF[r.id];
  var cls = r.over > 0 ? 'over' : r.over === 0 ? 'now' : '';
  var when = r.over > 0 ? r.over + 'd overdue' : r.over === 0 ? 'Due today' : 'in ' + (-r.over) + 'd';
  return '<div class="rev ' + cls + '" style="' + cvars(s) + '">' +
    '<span class="badge" style="width:26px;height:26px;flex:0 0 26px;border-radius:6px">' + ic(s.icon) + '</span>' +
    '<span class="rev-b"><b>' + esc(c.n) + '</b><span>' + esc(s.short) + ' · ' + esc(when) + ' · ' + shortDate(r.due) + '</span></span>' +
    '<span class="stage">' + esc(REV_NAMES[r.stage]) + '</span>' +
    '<button class="btn btn-s btn-sm" data-rev-done="' + c.id + '" type="button">' + ic('tick') + 'Revised</button>' +
    '<button class="ib" data-rev-skip="' + c.id + '" type="button" aria-label="Remove from revision">' + ic('x') + '</button>' +
    '</div>';
}

/* ═══════════════ SUBJECTS ═══════════════ */
var sQuery = '', sFilter = 'all';

function vSubjects() {
  var o = overall();
  var h = '<div class="page-head"><div><h1>Subjects</h1>' +
    '<p class="num">' + o.done + ' of ' + TOTAL_CH + ' chapters complete · ' + o.pct + '% overall</p></div>' +
    '<div class="right">' +
      '<div class="search">' + ic('search') +
        '<input class="inp" id="subjSearch" type="search" placeholder="Search chapter or subject" value="' + esc(sQuery) + '" aria-label="Search"></div>' +
      '<div class="seg" role="group" aria-label="Filter">' +
        ['all', 'progress', 'pending', 'done'].map(function (f) {
          var lbl = { all:'All', progress:'Active', pending:'Not started', done:'Done' }[f];
          return '<button data-filter="' + f + '" class="' + (sFilter === f ? 'on' : '') + '" type="button">' + lbl + '</button>';
        }).join('') + '</div>' +
      '<button class="btn btn-s btn-sm" id="expandAll" type="button">' + ic('layers') + 'Expand all</button>' +
    '</div></div>';

  var q = sQuery.toLowerCase().trim(), shown = 0, body = '';
  SUBJECTS.forEach(function (s) {
    var st = subjStats(s);
    if (sFilter === 'done' && st.pct < 100) return;
    if (sFilter === 'pending' && st.pct !== 0) return;
    if (sFilter === 'progress' && (st.pct === 0 || st.pct === 100)) return;
    var mSubj = !q || s.name.toLowerCase().indexOf(q) >= 0 || s.short.toLowerCase().indexOf(q) >= 0;
    var chs = s.ch.filter(function (c) { return mSubj || c.n.toLowerCase().indexOf(q) >= 0; });
    if (!chs.length) return;
    shown++; body += subjCard(s, st, chs, !!q);
  });

  h += shown ? '<div class="grid g-auto">' + body + '</div>'
             : empty('search', 'No matches', 'Try a different search term or filter.');
  return h;
}

function subjCard(s, st, chs, forceOpen) {
  var open = forceOpen || S.ui.open[s.id];
  return '<article class="subj' + (open ? ' open' : '') + '" data-subj="' + s.id + '" style="' + cvars(s) + '">' +
    '<button class="subj-h" data-toggle="' + s.id + '" type="button" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span class="badge">' + ic(s.icon) + '</span>' +
      '<span class="subj-m"><h3>' + esc(s.name) + '</h3>' +
        '<span class="meta">' + st.done + '/' + st.total + ' chapters · ' + esc(s.years) +
        (s.pyqOnly ? ' · PYQ only' : '') + '</span></span>' +
      '<span class="subj-prog"><span class="track" style="--c:var(--c)"><i style="width:' + st.pct + '%"></i></span>' +
        '<span class="pc num">' + st.pct + '%</span></span>' +
      ic('chev', 'chev') + '</button>' +
    '<div class="chaps">' + chs.map(function (c) { return chapHTML(c, s); }).join('') + docsHTML(s) + '</div>' +
  '</article>';
}

function docsHTML(s) {
  if (!s.docs || !s.docs.length) return '';
  return '<div style="padding:var(--s4) var(--s5);display:flex;gap:var(--s2);flex-wrap:wrap;background:var(--card);' +
    'border-top:1px solid var(--border)">' + s.docs.map(function (d) {
      return '<a class="lnk" style="flex:1;min-width:200px" href="' + d.f + '" target="_blank" rel="noopener">' +
        '<span class="li" style="background:var(--c-soft);color:var(--c-ink)">' + ic('file') + '</span>' +
        '<span class="nm">' + esc(d.n) + '</span><span class="ex">' + ic('ext') + '</span></a>';
    }).join('') + '</div>';
}

function chapHTML(c, s) {
  var st = stOf(c.id), done = chDone(c.id), open = S.ui.open['ch_' + c.id];
  var subs = S.subs[c.id] || [], note = S.notes[c.id] || '', rev = S.rev[c.id];
  var subDone = subs.filter(function (x) { return x.d; }).length;

  var h = '<div class="chap' + (done ? ' done' : '') + (open ? ' open' : '') + (s.pyqOnly ? ' pyq' : '') +
    '" data-chap="' + c.id + '">';

  h += '<div class="chap-h">' +
    '<span class="chap-n">' + esc(c.n) + '<span class="qs">' + c.q + ' Qs</span>' +
    '<span class="done-tag">' + ic('tick') + 'Done</span></span>' +
    '<span class="chap-t">' +
      (rev ? '<span class="stage" title="Next revision ' + prettyDate(rev.due) + '">' + esc(REV_NAMES[rev.stage] || 'Mastered') + '</span>' : '') +
      '<button class="ib' + (open ? ' on' : '') + (subs.length ? ' has' : '') + '" data-expand="' + c.id + '" type="button" ' +
        'aria-expanded="' + (open ? 'true' : 'false') + '" aria-label="Subtopics and notes">' + ic('plus') + '</button>' +
      '<button class="ib' + (note ? ' has' : '') + '" data-note="' + c.id + '" type="button" aria-label="Note">' + ic('note') + '</button>' +
    '</span></div>';

  h += '<div class="tracks">' + c.tracks.map(function (t) {
    var v = st[t.k] || 'pending';
    return '<button class="tk" data-s="' + v + '" data-ch="' + c.id + '" data-k="' + t.k + '" type="button" ' +
      'aria-label="' + esc(t.label) + ': ' + ST_LABEL[v] + '. Activate to change">' +
      '<span class="tk-line"></span>' +
      '<span class="tk-box">' + ic('check') + '</span>' +
      '<span class="tk-txt"><b>' + esc(t.label) + '</b><i>' + ST_LABEL[v] + '</i></span></button>';
  }).join('') + '</div>';

  h += '<div class="drawer">';
  h += '<div class="dw"><h5>Subtopics' + (subs.length ? ' · ' + subDone + '/' + subs.length : '') + '</h5>' +
    '<div class="subs">' + (subs.length ? subs.map(function (x) {
      return '<div class="sub' + (x.d ? ' done' : '') + '">' +
        '<button class="stick" data-sub-tick="' + c.id + '|' + x.id + '" type="button" ' +
          'aria-label="' + esc(x.n) + (x.d ? ' (done)' : ' (pending)') + '">' + ic('tick') + '</button>' +
        '<span class="sn">' + esc(x.n) + '</span>' +
        '<button class="sdel" data-sub-del="' + c.id + '|' + x.id + '" type="button" aria-label="Delete subtopic">' + ic('trash') + '</button></div>';
    }).join('') : '<p style="font-size:12px;color:var(--faint);padding:3px 2px">No subtopics yet.</p>') + '</div>' +
    '<div class="row"><input class="inp" data-sub-inp="' + c.id + '" placeholder="Add a subtopic" aria-label="New subtopic">' +
      '<button class="btn btn-s btn-sm" data-sub-add="' + c.id + '" type="button">' + ic('plus') + 'Add</button></div></div>';

  h += '<div class="dw"><h5>Notes &amp; mistakes</h5>' +
    '<textarea class="ta" data-note-ta="' + c.id + '" placeholder="Formulas, silly mistakes, tricky cases">' + esc(note) + '</textarea>' +
    '<div style="display:flex;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap;align-items:center">' +
      (rev ? '<button class="btn btn-s btn-sm" data-rev-skip="' + c.id + '" type="button">' + ic('x') + 'Remove revision</button>' +
             '<span style="font-size:11.5px;color:var(--muted)">Next ' + shortDate(rev.due) + '</span>'
           : '<button class="btn btn-s btn-sm" data-rev-add="' + c.id + '" type="button">' + ic('repeat') + 'Schedule revision</button>') +
    '</div></div>';
  h += '</div></div>';
  return h;
}

/* ═══════════════ REVISION ═══════════════ */

    (soon.length ? soon.map(revRow).join('') : empty('cal', 'Schedule is empty', 'It fills up as you complete chapters.')) +

}

/* ═══════════════ NOTES ═══════════════ */
var nQuery = '';
function vNotes() {
  var items = [];
  for (var id in S.notes) {
    if (!CHAP_OF[id] || !String(S.notes[id]).trim()) continue;
    items.push({ id:id, txt:S.notes[id] });
  }
  var q = nQuery.toLowerCase().trim();
  var filt = items.filter(function (it) {
    if (!q) return true;
    return it.txt.toLowerCase().indexOf(q) >= 0 || CHAP_OF[it.id].n.toLowerCase().indexOf(q) >= 0 ||
           SUBJ_OF[it.id].name.toLowerCase().indexOf(q) >= 0;
  });

  var h = '<div class="page-head"><div><h1>Notes</h1>' +
    '<p class="num">' + items.length + ' chapters have notes</p></div>' +
    '<div class="right"><div class="search">' + ic('search') +
      '<input class="inp" id="noteSearch" type="search" placeholder="Search notes" value="' + esc(nQuery) + '" aria-label="Search notes"></div></div></div>';

  if (!filt.length) {
    return h + empty('note', q ? 'No matches' : 'No notes yet',
      q ? 'Try a different keyword.' : 'Open any chapter in Subjects and tap the note icon.');
  }
  h += '<div class="grid g-auto">' + filt.map(function (it) {
    var s = SUBJ_OF[it.id];

      '<div class="note-h"><b>' + esc(CHAP_OF[it.id].n) + '</b><span class="sj">' + esc(s.short) + '</span>' +
      '<button class="ib" style="margin-left:auto" data-note="' + it.id + '" type="button" aria-label="Edit note">' + ic('edit') + '</button></div>' +
      '<p>' + esc(it.txt) + '</p></div>';

/* ═══════════════ TIMER ═══════════════ */
var MODES = { focus:{ m:25, l:'Focus' }, short:{ m:5, l:'Short break' }, long:{ m:15, l:'Long break' } };
var T = { mode:'focus', left:25 * 60, running:false, id:null, acc:0 };

function vTimer() {
  var totals = S.tm.totals || {};
  var ranked = SUBJECTS.map(function (s) { return { s:s, m:totals[s.id] || 0 }; })
    .filter(function (r) { return r.m > 0; }).sort(function (a, b) { return b.m - a.m; });
  var maxM = ranked.length ? ranked[0].m : 1;

  var h = '<div class="page-head"><div><h1>Timer</h1>' +
    '<p>' + fmtMin(minsToday()) + ' today · ' + fmtMin(minsTotal()) + ' all time</p></div></div>';

  h += '<div class="grid g-2">';
  h += '<div class="card" id="timerCard"><div class="card-b">' +
    '<div class="tm-mode">' + esc(MODES[T.mode].l) + '</div>' +
    '<div class="tm-dial">' + donut(pctDone(), 190, 10).replace('class="tr"', 'class="tm-tr"').replace('class="fg"', 'class="tm-fg"') +
      '<div class="tm-t num" id="tmTime">' + mmss(T.left) + '</div></div>' +
    '<div class="tm-btns">' +
      '<button class="btn btn-p" id="tPlay" type="button">' + ic(T.running ? 'pause' : 'play') + (T.running ? 'Pause' : 'Start') + '</button>' +
      '<button class="btn btn-s" id="tReset" type="button">' + ic('reset') + 'Reset</button>' +
    '</div>' +
    '<div class="tm-btns" style="margin-top:var(--s3)"><div class="seg">' +
      Object.keys(MODES).map(function (m) {
        return '<button data-mode="' + m + '" class="' + (T.mode === m ? 'on' : '') + '" type="button">' +
          MODES[m].l + ' · ' + MODES[m].m + 'm</button>';
      }).join('') + '</div></div>' +
    '</div></div>';

  h += '<div class="card"><div class="card-h"><div><h3>Session subject</h3>' +
    '<div class="sub">Focus minutes are logged against this subject</div></div></div><div class="card-b">' +
    '<select class="sel" id="tSubj" aria-label="Subject for this session">' +
      '<option value="">No subject</option>' +
      SUBJECTS.map(function (s) {
        return '<option value="' + s.id + '"' + (S.tm.subj === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>';
      }).join('') + '</select>' +
    '<div class="sec" style="margin:var(--s5) 0 var(--s3)"><h2>Time log</h2>' +
      '<span class="cnt">' + ranked.length + ' subjects</span></div>' +
    (ranked.length ? ranked.map(function (r) {
      return '<div class="lrow" style="' + cvars(r.s) + '"><span class="nm">' + esc(r.s.short) + '</span>' +
        '<span class="track" style="--c:var(--c)"><i style="width:' + Math.round(r.m / maxM * 100) + '%"></i></span>' +
        '<span class="v">' + fmtMin(r.m) + '</span></div>';
    }).join('') : empty('clock', 'No time logged', 'Start the timer and a per-subject breakdown appears here.')) +
  '</div></div></div>';
  return h;
}
function mmss(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function pctDone() { var tot = MODES[T.mode].m * 60; return Math.round((tot - T.left) / tot * 100); }

function timerTick() {
  if (T.left > 0) T.left--;
  T.acc++;
  if (T.acc >= 60) {
    T.acc = 0;
    if (T.mode === 'focus') {
      bump('m', 1);
      if (S.tm.subj) S.tm.totals[S.tm.subj] = (S.tm.totals[S.tm.subj] || 0) + 1;
      save();
    }
  }
  paintTimer();
  if (T.left <= 0) {
    stopTimer();
    var wasFocus = T.mode === 'focus';
    toast(wasFocus ? 'Session complete. Take a break.' : 'Break over — back to focus.', 'ok', 5000);
    confetti(innerWidth / 2, innerHeight / 3, 40);
    try { beep(); } catch (e) {}
    T.mode = wasFocus ? 'short' : 'focus';
    T.left = MODES[T.mode].m * 60;
    if (view === 'timer') render();
    renderNav();
  }
}
function paintTimer() {
  var p = el('pillTime');
  if (p) p.textContent = T.running ? mmss(T.left) : fmtMin(minsToday());
  var tEl = el('tmTime'); if (!tEl) return;
  tEl.textContent = mmss(T.left);
  var fg = document.querySelector('.tm-fg');
  if (fg) {
    var r = +fg.getAttribute('r'), c = 2 * Math.PI * r;
    fg.style.strokeDashoffset = (c * (1 - pctDone() / 100)).toFixed(1);
  }
}
function startTimer() {
  if (T.running) return;
  T.running = true; T.id = setInterval(timerTick, 1000);
  var b = el('tPlay'); if (b) b.innerHTML = ic('pause') + 'Pause';
  var pill = el('timerPill');
  if (pill) { pill.classList.add('on'); pill.innerHTML = '<span class="live-dot"></span><b class="num" id="pillTime">' + mmss(T.left) + '</b>'; }
}
function stopTimer() {
  T.running = false; clearInterval(T.id); T.id = null;
  var b = el('tPlay'); if (b) b.innerHTML = ic('play') + 'Start';
  var pill = el('timerPill');
  if (pill) { pill.classList.remove('on'); pill.innerHTML = ic('timer') + '<b class="num" id="pillTime">' + fmtMin(minsToday()) + '</b>'; }
  paintTimer();
}
function beep() {
  var A = window.AudioContext || window.webkitAudioContext; if (!A) return;
  var a = new A(), o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination); o.type = 'sine'; o.frequency.value = 820;
  g.gain.setValueAtTime(.001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.22, a.currentTime + .02);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .6);
  o.start(); o.stop(a.currentTime + .62);
}

/* ═══════════════ RENDER ═══════════════ */
var RENDER = { dash:vDash, subjects:vSubjects, revision:vRevision, practice:vPractice, notes:vNotes, timer:vTimer, settings:vSettings };
function render() {
  el('content').innerHTML = '<div class="view active">' + (RENDER[view] || vDash)() + '</div>';
  if (view === 'timer') paintTimer();
  stagger();
}
function stagger() {
  if (reduceMotion) return;
  var items = el('content').querySelectorAll('.stat, .subj, .note, .card');
  for (var i = 0; i < items.length && i < 14; i++) {
    (function (n, delay) {
      n.style.opacity = '0'; n.style.transform = 'translateY(6px)';
      setTimeout(function () {
        n.style.transition = 'opacity .28s cubic-bezier(.2,.7,.3,1), transform .28s cubic-bezier(.2,.7,.3,1)';
        n.style.opacity = '1'; n.style.transform = 'none';
        setTimeout(function () { n.style.transition = ''; n.style.transform = ''; }, 320);
      }, delay);
    })(items[i], i * 26);
  }
}

function refreshSubj(subjId) {
  var s = SUBJECTS.filter(function (x) { return x.id === subjId; })[0]; if (!s) return;
  var card = document.querySelector('.subj[data-subj="' + subjId + '"]'); if (!card) return;
  var st = subjStats(s);
  var pc = card.querySelector('.subj-h .pc'); if (pc) pc.textContent = st.pct + '%';
  var fill = card.querySelector('.subj-h .track i'); if (fill) fill.style.width = st.pct + '%';
  var meta = card.querySelector('.subj-h .meta');
  if (meta) meta.textContent = st.done + '/' + st.total + ' chapters · ' + s.years + (s.pyqOnly ? ' · PYQ only' : '');
}

/* ═══════════════ Tri-state cycle ═══════════════ */
function cycle(btn) {
  var chId = btn.getAttribute('data-ch'), k = btn.getAttribute('data-k');
  var st = stOf(chId), cur = st[k] || 'pending';
  var next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
  var wasDone = chDone(chId);

  st[k] = next;
  if (k === 't' && next === 'done' && !S.rev[chId]) scheduleRev(chId, 0);
  bump('a');

  /* Semantic state is set directly — never waits on transitionend */
  btn.setAttribute('data-s', next);
  var lab = btn.querySelector('.tk-txt i'); if (lab) lab.textContent = ST_LABEL[next];
  var trackName = (btn.querySelector('.tk-txt b') || {}).textContent || '';
  btn.setAttribute('aria-label', trackName + ': ' + ST_LABEL[next] + '. Activate to change');

  btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump');

  var row = btn.closest('.chap'), nowDone = chDone(chId);
  if (row) row.classList.toggle('done', nowDone);
  if (!wasDone && nowDone) {
    if (!S.doneAt[chId]) S.doneAt[chId] = today();
    var r = btn.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2, 30);
    toast(CHAP_OF[chId].n + ' complete', 'ok', 3000);
  } else if (wasDone && !nowDone) {
    delete S.doneAt[chId];
  }
  save();
  refreshSubj(SUBJ_OF[chId].id);
  renderNav();
}

/* ═══════════════ Events ═══════════════ */
document.addEventListener('click', function (e) {
  var t = e.target, n;

  if ((n = t.closest('[data-go]'))) { go(n.getAttribute('data-go')); return; }
  if ((n = t.closest('[data-open-subj]'))) {
    var sid = n.getAttribute('data-open-subj');
    S.ui.open[sid] = true; save(); go('subjects');
    setTimeout(function () {
      var c = document.querySelector('.subj[data-subj="' + sid + '"]');
      if (c) c.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block:'start' });
    }, 120);
    return;
  }
  if ((n = t.closest('.tk'))) { cycle(n); return; }

  if ((n = t.closest('[data-toggle]'))) {
    var id = n.getAttribute('data-toggle'), card = n.closest('.subj');
    var open = !card.classList.contains('open');
    card.classList.toggle('open', open);
    n.setAttribute('aria-expanded', open ? 'true' : 'false');
    S.ui.open[id] = open; save();
    return;
  }
  if ((n = t.closest('[data-expand]'))) {
    var cid = n.getAttribute('data-expand'), row = n.closest('.chap');
    var ex = !row.classList.contains('open');
    row.classList.toggle('open', ex);
    n.classList.toggle('on', ex);
    n.setAttribute('aria-expanded', ex ? 'true' : 'false');
    S.ui.open['ch_' + cid] = ex; save();
    if (ex) { var i = row.querySelector('[data-sub-inp]'); if (i) i.focus(); }
    return;
  }

  if ((n = t.closest('[data-sub-add]'))) { addSub(n.getAttribute('data-sub-add')); return; }
  if ((n = t.closest('[data-sub-tick]'))) {
    var pr = n.getAttribute('data-sub-tick').split('|'), arr = S.subs[pr[0]] || [];
    for (var i2 = 0; i2 < arr.length; i2++) if (arr[i2].id === pr[1]) arr[i2].d = !arr[i2].d;
    bump('a'); save();
    var item = n.closest('.sub');
    item.classList.toggle('done');
    if (item.classList.contains('done')) {
      var rr = n.getBoundingClientRect();
      confetti(rr.left + rr.width / 2, rr.top + rr.height / 2, 10);
    }
    var hd = n.closest('.dw').querySelector('h5');
    var dn = arr.filter(function (x) { return x.d; }).length;
    if (hd) hd.textContent = 'Subtopics · ' + dn + '/' + arr.length;
    return;
  }
  if ((n = t.closest('[data-sub-del]'))) {
    var p2 = n.getAttribute('data-sub-del').split('|');
    S.subs[p2[0]] = (S.subs[p2[0]] || []).filter(function (x) { return x.id !== p2[1]; });
    save(); render(); return;
  }

  if ((n = t.closest('[data-note]'))) { noteModal(n.getAttribute('data-note')); return; }

  if ((n = t.closest('[data-rev-done]'))) {
    var rid = n.getAttribute('data-rev-done'), r = S.rev[rid];
    if (r) {
      r.stage++;
      if (r.stage >= REV_STEPS.length) {
        r.due = ''; toast(CHAP_OF[rid].n + ' — mastered', 'ok');
        confetti(innerWidth / 2, innerHeight / 3, 34);
      } else {
        r.due = addDays(today(), REV_STEPS[r.stage]);
        toast('Next revision ' + prettyDate(r.due), 'ok');
      }
    }
    bump('a'); save(); render(); renderNav(); return;
  }
  if ((n = t.closest('[data-rev-skip]'))) { delete S.rev[n.getAttribute('data-rev-skip')]; save(); render(); renderNav(); return; }
  if ((n = t.closest('[data-rev-add]'))) {
    scheduleRev(n.getAttribute('data-rev-add'), 0); save(); render(); renderNav();
    toast('Revision scheduled for 3 days from now', 'ok'); return;
  }

  if ((n = t.closest('[data-paper]'))) {
    var pid = n.getAttribute('data-paper');
    if (!S.pp[pid]) S.pp[pid] = { d:false, s:'' };
    S.pp[pid].d = !S.pp[pid].d;
    bump('a'); save();
    if (S.pp[pid].d) { var pr2 = n.getBoundingClientRect(); confetti(pr2.left + 9, pr2.top + 9, 14); }
    render(); return;
  }

  if ((n = t.closest('[data-filter]'))) { sFilter = n.getAttribute('data-filter'); render(); return; }
  if (t.closest('#expandAll')) {
    var anyOpen = SUBJECTS.some(function (s) { return S.ui.open[s.id]; });
    SUBJECTS.forEach(function (s) { S.ui.open[s.id] = !anyOpen; });
    save(); render(); return;
  }

  if (t.closest('#timerPill')) { go('timer'); return; }
  if (t.closest('#tPlay')) { T.running ? stopTimer() : startTimer(); return; }
  if (t.closest('#tReset')) { stopTimer(); T.left = MODES[T.mode].m * 60; T.acc = 0; paintTimer(); return; }
  if ((n = t.closest('[data-mode]'))) {
    stopTimer(); T.mode = n.getAttribute('data-mode'); T.left = MODES[T.mode].m * 60; T.acc = 0; render(); return;
  }

  if (t.closest('#setSave')) {
    S.pf.name = el('setName').value.trim() || 'Gaurav Tiwari';
    S.pf.exam = el('setExam').value.trim() || 'GATE CSE 2027';
    S.pf.date = el('setDate').value;
    save(true); renderNav(); render(); toast('Profile saved', 'ok'); return;
  }
  if (t.closest('#btnExport')) { doExport(); return; }
  if (t.closest('#btnImport')) { el('fileIn').click(); return; }
  if (t.closest('#btnCopy')) { doCopy(); return; }
  if (t.closest('#btnReset')) { confirmReset(); return; }

  if (t.closest('[data-close]')) { closeModal(); return; }
  if (t.closest('#noteSave')) {
    var mid = el('modal').getAttribute('data-chap');
    S.notes[mid] = el('noteBox').value;
    if (!S.notes[mid].trim()) delete S.notes[mid];
    bump('a'); save(true); closeModal(); render(); toast('Note saved', 'ok'); return;
  }
  if (t.closest('#resetYes')) {
    try { localStorage.removeItem(KEY); localStorage.removeItem(BAK); } catch (e) {}
    S = blankState(); save(true); closeModal(); renderNav(); go('dash'); toast('Everything reset', 'warn'); return;
  }
});

  if (t.id === 'subjSearch') { sQuery = t.value; debounceRender('subjects'); return; }
  if (t.id === 'noteSearch') { nQuery = t.value; debounceRender('notes'); return; }

    var id = t.getAttribute('data-note-ta');

    save(); return;
  }
  if (t.hasAttribute && t.hasAttribute('data-paper-score')) {
    var pid = t.getAttribute('data-paper-score');

});
document.addEventListener('change', function (e) {
  if (e.target.id === 'tSubj') { S.tm.subj = e.target.value; save(); return; }
  if (e.target.id === 'fileIn') { doImport(e.target.files[0]); return; }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.hasAttribute && e.target.hasAttribute('data-sub-inp')) {
    addSub(e.target.getAttribute('data-sub-inp')); return;
  }
  if (e.key === 'Escape') { closeModal(); return; }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); go('subjects');
    setTimeout(function () { var i = el('subjSearch'); if (i) i.focus(); }, 90); return;
  }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); go('subjects'); setTimeout(function () { var i = el('subjSearch'); if (i) i.focus(); }, 90); return; }
  if (e.key >= '1' && e.key <= '7') { go(VIEWS[+e.key - 1].id); return; }
  if (e.key.toLowerCase() === 't') { T.running ? stopTimer() : startTimer(); toast(T.running ? 'Timer running' : 'Timer paused'); return; }
});

var dbT = null;
function debounceRender(v) { clearTimeout(dbT); dbT = setTimeout(function () { if (view === v) render(); }, 170); }

function addSub(chId) {
  var inp = document.querySelector('[data-sub-inp="' + chId + '"]');
  if (!inp) return;
  var v = inp.value.trim(); if (!v) { inp.focus(); return; }
  if (!S.subs[chId]) S.subs[chId] = [];
  S.subs[chId].push({ id:'s' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), n:v, d:false });
  inp.value = ''; bump('a'); S.ui.open['ch_' + chId] = true; save();
  render();
  setTimeout(function () { var i = document.querySelector('[data-sub-inp="' + chId + '"]'); if (i) i.focus(); }, 60);
}

function noteModal(chId) {
  var c = CHAP_OF[chId], s = SUBJ_OF[chId];
  el('modal').setAttribute('data-chap', chId);
  openModal('<h3>' + esc(c.n) + '</h3><p class="md">' + esc(s.name) + ' · ' + c.q + ' PYQs</p>' +
    '<textarea class="ta" id="noteBox" style="min-height:200px" placeholder="Formulas, silly mistakes, tricky cases">' +
    esc(S.notes[chId] || '') + '</textarea>' +
    '<div style="display:flex;gap:var(--s2);margin-top:var(--s5);justify-content:flex-end;flex-wrap:wrap">' +
      '<button class="btn btn-s" data-close type="button">Cancel</button>' +
      '<button class="btn btn-p" id="noteSave" type="button">' + ic('save') + 'Save</button></div>');
}

function confirmReset() {
  openModal('<h3 style="color:var(--red-ink)">Reset everything?</h3>' +
    '<p class="md">Every chapter status, note, subtopic, revision entry, time log and streak will be deleted. ' +
    'This cannot be undone — export a backup first if you want one.</p>' +
    '<div style="display:flex;gap:var(--s2);justify-content:flex-end;flex-wrap:wrap">' +
      '<button class="btn btn-s" data-close type="button">Cancel</button>' +
      '<button class="btn btn-d" id="resetYes" type="button">' + ic('trash') + 'Delete everything</button></div>');
}

/* ═══════════════ Backup ═══════════════ */
function payload() { return JSON.stringify({ app:'gate-command-center', v:1, at:new Date().toISOString(), data:S }, null, 2); }
function doExport() {
  try {
    var b = new Blob([payload()], { type:'application/json' });
    var u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = 'gate-progress-' + today() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(u); }, 1500);
    toast('Backup downloaded', 'ok');
  } catch (e) { toast('Download blocked — use Copy to clipboard instead', 'err', 5000); }
}
function doCopy() {
  var txt = payload(), done = function () { toast('Backup copied to clipboard', 'ok'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, cb) {
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { toast('Copy failed', 'err'); }
  document.body.removeChild(ta);
}
function doImport(file) {
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var o = JSON.parse(fr.result), d = o && o.data ? o.data : o;
      if (!d || typeof d !== 'object' || !d.ch) throw new Error('shape');
      var b = blankState();
      for (var k in b) if (!(k in d)) d[k] = b[k];
      d.pf = d.pf || {};
      for (var pk in b.pf) if (!(pk in d.pf)) d.pf[pk] = b.pf[pk];
      S = d; save(true); renderNav(); render();
      toast('Backup restored', 'ok');
    } catch (e) { toast('Could not read that file — pick a valid JSON backup', 'err', 5000); }
  };
  fr.onerror = function () { toast('File read failed', 'err'); };
  fr.readAsText(file);
  el('fileIn').value = '';
}

/* ═══════════════ Boot ═══════════════ */
load();
if (S.ui && S.ui.view && RENDER[S.ui.view]) view = S.ui.view;
renderNav();
render();
setInterval(renderNav, 60000);
addEventListener('beforeunload', function () { save(true); });
if (!storageOK) toast('Browser storage is blocked — progress will not save. See Settings.', 'err', 8000);
})();

</script>
